services:
  faska-art:
    build:
      context: ../site
      dockerfile: Dockerfile
      network: host
    image: faska-art:${FASKA_ART_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.faska-art-http.rule=Host(`faska-art.com`) || Host(`www.faska-art.com`)
      - traefik.http.routers.faska-art-http.entrypoints=web
      - traefik.http.routers.faska-art-http.middlewares=faska-art-https
      - traefik.http.routers.faska-art-http.service=faska-art
      - traefik.http.middlewares.faska-art-https.redirectscheme.scheme=https
      - traefik.http.middlewares.faska-art-https.redirectscheme.permanent=true
      - traefik.http.routers.faska-art.rule=Host(`faska-art.com`) || Host(`www.faska-art.com`)
      - traefik.http.routers.faska-art.entrypoints=websecure
      - traefik.http.routers.faska-art.tls=true
      - traefik.http.routers.faska-art.tls.certresolver=letsencrypt
      - traefik.http.services.faska-art.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true
